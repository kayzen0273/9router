<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🔥 CLAUDE 11 AKUN - POPUP CONTROLLER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            letter-spacing: 2px;
            border-bottom: 2px solid #00ff41;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #111;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #1a1a1a;
            margin-bottom: 15px;
        }
        .top-bar .active-info {
            font-size: 16px;
        }
        .top-bar .active-info strong {
            color: #ffcc00;
        }
        .badge {
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.online {
            background: #00ff41;
            color: #0a0a0a;
        }
        .badge.limit {
            background: #ff4444;
            color: #fff;
        }
        .badge.idle {
            background: #444;
            color: #aaa;
        }
        .badge.used {
            background: #ffcc00;
            color: #0a0a0a;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 6px 14px;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #00ff41;
            color: #0a0a0a;
        }
        .btn.danger {
            border-color: #ff4444;
            color: #ff4444;
        }
        .btn.danger:hover {
            background: #ff4444;
            color: #0a0a0a;
        }
        .btn.warning {
            border-color: #ffcc00;
            color: #ffcc00;
        }
        .btn.warning:hover {
            background: #ffcc00;
            color: #0a0a0a;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            margin: 12px 0;
        }
        .account-card {
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .account-card:hover {
            border-color: #00ff41;
        }
        .account-card.active {
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0,255,65,0.15);
        }
        .account-card .num {
            font-size: 10px;
            color: #666;
        }
        .account-card .label {
            font-size: 12px;
            font-weight: bold;
            margin: 2px 0;
        }
        .account-card .email {
            font-size: 9px;
            color: #666;
            word-break: break-all;
        }
        .account-card .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 4px;
        }
        .dot.online {
            background: #00ff41;
        }
        .dot.limit {
            background: #ff4444;
        }
        .dot.idle {
            background: #444;
        }
        .dot.used {
            background: #ffcc00;
        }
        .log {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 11px;
            color: #888;
            margin-top: 12px;
        }
        .log span {
            display: block;
            padding: 2px 0;
            border-bottom: 1px solid #0d0d0d;
        }
        .log .hl {
            color: #00ff41;
        }
        .log .warn {
            color: #ffcc00;
        }
        .log .err {
            color: #ff4444;
        }
        .note {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-top: 12px;
            border-top: 1px solid #1a1a1a;
            padding-top: 12px;
        }
        .shortcut-hint {
            font-size: 10px;
            color: #444;
            margin-top: 4px;
        }
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            .account-card .email {
                display: none;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 CLAUDE 11 AKUN — POPUP CONTROLLER</h1>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="active-info">
            📌 <strong id="activeLabel">-</strong>
            <span class="badge idle" id="statusBadge">IDLE</span>
            <span style="margin-left:10px;font-size:12px;color:#666;">🔄 <span id="switchCount">0</span>x</span>
        </div>
        <div class="btn-group">
            <button class="btn" id="btnPrev">◀ Prev</button>
            <button class="btn" id="btnNext">Next ▶</button>
            <button class="btn warning" id="btnOpenAll">🪟 Buka Semua</button>
            <button class="btn" id="btnFocus">🎯 Focus</button>
            <button class="btn danger" id="btnCloseAll">✖ Tutup Semua</button>
        </div>
    </div>

    <!-- GRID -->
    <div class="grid" id="accountGrid"></div>

    <!-- LOG -->
    <div class="log" id="logArea">
        <span class="hl">🔥 Dashboard siap. Klik "Buka Semua" untuk buka 11 popup Claude.</span>
        <span>💡 Setelah login semua, tinggal klik kartu buat pindah.</span>
    </div>

    <div class="note">
        ⚡ Claude <strong>TIDAK BISA</strong> di-iframe — pakai POPUP WINDOW.<br/>
        ⌨️ <strong>Ctrl+→</strong> next | <strong>Ctrl+←</strong> prev | <strong>Ctrl+F</strong> focus
    </div>
</div>

<script>
    // ==================== KONFIG ====================
    const ACCOUNTS = [
        { id: 0, email: 'andre1@gmail.com', label: 'Akun 1' },
        { id: 1, email: 'andre2@gmail.com', label: 'Akun 2' },
        { id: 2, email: 'andre3@gmail.com', label: 'Akun 3' },
        { id: 3, email: 'andre4@gmail.com', label: 'Akun 4' },
        { id: 4, email: 'andre5@gmail.com', label: 'Akun 5' },
        { id: 5, email: 'andre6@gmail.com', label: 'Akun 6' },
        { id: 6, email: 'andre7@gmail.com', label: 'Akun 7' },
        { id: 7, email: 'andre8@gmail.com', label: 'Akun 8' },
        { id: 8, email: 'andre9@gmail.com', label: 'Akun 9' },
        { id: 9, email: 'andre10@gmail.com', label: 'Akun 10' },
        { id: 10, email: 'andre11@gmail.com', label: 'Akun 11' }
    ];

    const CHECK_INTERVAL = 3000;
    const POPUP_FEATURES = 'width=1200,height=800,menubar=no,toolbar=no,location=yes,status=no,scrollbars=yes';

    // ==================== STATE ====================
    let currentIndex = 0;
    let switchCount = 0;
    let isSwitching = false;
    let popups = {}; // { accountId: window }
    let popupStatus = {}; // { accountId: 'online'|'limit'|'idle'|'used' }
    let popupTitle = {}; // { accountId: string }

    // ==================== DOM ====================
    const grid = document.getElementById('accountGrid');
    const logArea = document.getElementById('logArea');
    const activeLabel = document.getElementById('activeLabel');
    const statusBadge = document.getElementById('statusBadge');
    const switchCountEl = document.getElementById('switchCount');

    // ==================== FUNGSI ====================
    function addLog(msg, type = '') {
        const span = document.createElement('span');
        span.className = type;
        span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logArea.appendChild(span);
        logArea.scrollTop = logArea.scrollHeight;
        while (logArea.children.length > 80) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    function renderGrid() {
        grid.innerHTML = '';
        ACCOUNTS.forEach((acc, i) => {
            const div = document.createElement('div');
            div.className = `account-card ${i === currentIndex ? 'active' : ''}`;
            const status = popupStatus[acc.id] || 'idle';
            const dotClass = {
                'online': 'online',
                'limit': 'limit',
                'idle': 'idle',
                'used': 'used'
            }[status] || 'idle';

            const isOpen = popups[acc.id] && !popups[acc.id].closed;
            const openIndicator = isOpen ? '🟢' : '🔴';

            div.innerHTML = `
                <div class="num">${openIndicator} #${i+1}</div>
                <div class="label">${acc.label}</div>
                <div class="email">${acc.email}</div>
                <div class="dot ${dotClass}"></div>
                <div style="font-size:8px;color:#555;margin-top:2px;">${status.toUpperCase()}</div>
            `;
            div.onclick = () => switchToAccount(i);
            grid.appendChild(div);
        });
    }

    function updateStatusBar() {
        const acc = ACCOUNTS[currentIndex];
        activeLabel.textContent = acc.label;
        const status = popupStatus[acc.id] || 'idle';
        statusBadge.textContent = status.toUpperCase();
        statusBadge.className = `badge ${status}`;
        switchCountEl.textContent = switchCount;
        renderGrid();
    }

    function switchToAccount(index) {
        if (isSwitching) return;
        if (index < 0 || index >= ACCOUNTS.length) return;

        const acc = ACCOUNTS[index];
        currentIndex = index;

        // Cek popup masih hidup
        const win = popups[acc.id];
        if (win && !win.closed) {
            win.focus();
            addLog(`🎯 Focus ke ${acc.label} (tab #${acc.id+1})`, 'hl');
        } else {
            // Popup mati, buka ulang
            openPopup(acc.id);
            addLog(`🔄 Buka ulang ${acc.label}`, 'warn');
        }

        updateStatusBar();

        // Save index
        try {
            localStorage.setItem('claude_11_index_v3', currentIndex);
        } catch(e) {}
    }

    function nextAccount() {
        if (isSwitching) return;
        const next = (currentIndex + 1) % ACCOUNTS.length;
        switchCount++;
        switchToAccount(next);
    }

    function prevAccount() {
        if (isSwitching) return;
        const prev = (currentIndex - 1 + ACCOUNTS.length) % ACCOUNTS.length;
        switchCount++;
        switchToAccount(prev);
    }

    function openPopup(accountId) {
        const acc = ACCOUNTS[accountId];
        const url = `https://claude.ai/login?email=${encodeURIComponent(acc.email)}`;

        // Tutup popup lama kalo ada
        if (popups[accountId] && !popups[accountId].closed) {
            popups[accountId].close();
        }

        const win = window.open(url, `claude_popup_${accountId}`, POPUP_FEATURES);

        if (win) {
            popups[accountId] = win;
            popupStatus[accountId] = 'idle';
            popupTitle[accountId] = '';

            // Monitor popup
            const monitor = setInterval(() => {
                if (win.closed) {
                    clearInterval(monitor);
                    popupStatus[accountId] = 'idle';
                    addLog(`❌ Popup ${acc.label} ditutup`, 'err');
                    renderGrid();
                    updateStatusBar();
                    return;
                }

                // Coba baca title
                try {
                    const title = win.document.title || '';
                    if (title && title !== popupTitle[accountId]) {
                        popupTitle[accountId] = title;
                        // Detect limit dari title
                        detectLimitFromTitle(accountId, title);
                    }
                } catch(e) {
                    // Cross-origin — coba dari URL
                    try {
                        const url = win.location.href || '';
                        detectLimitFromURL(accountId, url);
                    } catch(e2) {}
                }
            }, 1000);

            addLog(`📧 Buka popup: ${acc.label} (${acc.email})`, '');

        } else {
            addLog(`⚠️ Popup diblokir! Izinkan popup untuk ${acc.email}`, 'err');
        }

        renderGrid();
        updateStatusBar();
    }

    function openAllPopups() {
        addLog(`🪟 Membuka ${ACCOUNTS.length} popup Claude...`, 'warn');
        ACCOUNTS.forEach((acc, i) => {
            setTimeout(() => {
                openPopup(acc.id);
            }, i * 600);
        });
        setTimeout(() => {
            addLog(`✅ Semua popup dibuka! Login satu per satu.`, 'hl');
        }, ACCOUNTS.length * 600 + 2000);
    }

    function closeAllPopups() {
        if (!confirm('✖ Tutup semua popup Claude?')) return;
        addLog('✖ Menutup semua popup...', 'warn');
        ACCOUNTS.forEach(acc => {
            if (popups[acc.id] && !popups[acc.id].closed) {
                popups[acc.id].close();
            }
            popupStatus[acc.id] = 'idle';
        });
        renderGrid();
        updateStatusBar();
        addLog('✅ Semua popup ditutup', 'hl');
    }

    function focusCurrent() {
        const acc = ACCOUNTS[currentIndex];
        const win = popups[acc.id];
        if (win && !win.closed) {
            win.focus();
            addLog(`🎯 Focus ke ${acc.label}`, 'hl');
        } else {
            openPopup(acc.id);
        }
    }

    // ==================== DETECT LIMIT ====================
    function detectLimitFromTitle(accountId, title) {
        const lower = title.toLowerCase();
        const limitPatterns = [
            'limit', 'exceeded', 'too many', 'try again',
            'rate limit', 'unavailable', 'usage limit',
            'monthly limit', 'daily limit', 'message limit',
            'reached', 'can\'t send', 'request failed',
            'over quota', 'throttled', 'blocked', 'error'
        ];

        let isLimit = false;
        for (const pattern of limitPatterns) {
            if (lower.includes(pattern)) {
                isLimit = true;
                break;
            }
        }

        // Cek juga kalo title mengandung "Claude" tapi bukan error — berarti online
        const isOnline = lower.includes('claude') && !isLimit;

        if (isLimit) {
            if (popupStatus[accountId] !== 'limit') {
                popupStatus[accountId] = 'limit';
                const acc = ACCOUNTS.find(a => a.id === accountId);
                addLog(`🚨 ${acc.label} KENA LIMIT! (title: "${title}")`, 'err');
                renderGrid();
                updateStatusBar();
                // Auto-switch kalo ini akun aktif
                if (accountId === ACCOUNTS[currentIndex].id && !isSwitching) {
                    isSwitching = true;
                    setTimeout(() => {
                        nextAccount();
                        isSwitching = false;
                    }, 2000);
                }
            }
        } else if (isOnline) {
            if (popupStatus[accountId] !== 'online') {
                popupStatus[accountId] = 'online';
                const acc = ACCOUNTS.find(a => a.id === accountId);
                addLog(`✅ ${acc.label} Online`, 'hl');
                renderGrid();
                updateStatusBar();
            }
        }
    }

    function detectLimitFromURL(accountId, url) {
        const lower = url.toLowerCase();
        if (lower.includes('limit') || lower.includes('error') || lower.includes('blocked')) {
            if (popupStatus[accountId] !== 'limit') {
                popupStatus[accountId] = 'limit';
                const acc = ACCOUNTS.find(a => a.id === accountId);
                addLog(`🚨 ${acc.label} KENA LIMIT! (URL: "${url}")`, 'err');
                renderGrid();
                updateStatusBar();
                if (accountId === ACCOUNTS[currentIndex].id && !isSwitching) {
                    isSwitching = true;
                    setTimeout(() => {
                        nextAccount();
                        isSwitching = false;
                    }, 2000);
                }
            }
        }
    }

    // ==================== SCAN ALL POPUPS ====================
    function scanAllPopups() {
        ACCOUNTS.forEach(acc => {
            const win = popups[acc.id];
            if (!win || win.closed) {
                if (popupStatus[acc.id] !== 'idle') {
                    popupStatus[acc.id] = 'idle';
                    renderGrid();
                    updateStatusBar();
                }
                return;
            }

            try {
                const title = win.document.title || '';
                if (title) {
                    detectLimitFromTitle(acc.id, title);
                }
            } catch(e) {
                try {
                    const url = win.location.href || '';
                    detectLimitFromURL(acc.id, url);
                } catch(e2) {}
            }
        });
    }

    // ==================== INIT ====================
    function init() {
        // Load saved index
        try {
            const saved = localStorage.getItem('claude_11_index_v3');
            if (saved !== null) {
                const idx = parseInt(saved);
                if (!isNaN(idx) && idx >= 0 && idx < ACCOUNTS.length) {
                    currentIndex = idx;
                }
            }
        } catch(e) {}

        renderGrid();
        updateStatusBar();

        // Events
        document.getElementById('btnNext').addEventListener('click', () => {
            if (!isSwitching) nextAccount();
        });
        document.getElementById('btnPrev').addEventListener('click', () => {
            if (!isSwitching) prevAccount();
        });
        document.getElementById('btnOpenAll').addEventListener('click', openAllPopups);
        document.getElementById('btnCloseAll').addEventListener('click', closeAllPopups);
        document.getElementById('btnFocus').addEventListener('click', focusCurrent);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && e.ctrlKey) {
                e.preventDefault();
                if (!isSwitching) nextAccount();
            }
            if (e.key === 'ArrowLeft' && e.ctrlKey) {
                e.preventDefault();
                if (!isSwitching) prevAccount();
            }
            if (e.key === 'f' && e.ctrlKey) {
                e.preventDefault();
                focusCurrent();
            }
        });

        // Auto-scan
        setInterval(scanAllPopups, CHECK_INTERVAL);

        // Save index
        setInterval(() => {
            try {
                localStorage.setItem('claude_11_index_v3', currentIndex);
            } catch(e) {}
        }, 5000);

        addLog(`🔥 CLAUDE 11 AKUN v3 siap! Total ${ACCOUNTS.length} akun.`, 'hl');
        addLog(`💡 Klik "Buka Semua" → izinkan popup → login semua akun.`, '');
        addLog(`⌨️ Ctrl+→ / Ctrl+← = ganti akun | Ctrl+F = focus`, '');
    }

    init();

    // ==================== GLOBAL ====================
    window.__claude11 = {
        accounts: ACCOUNTS,
        switchTo: switchToAccount,
        next: nextAccount,
        prev: prevAccount,
        openAll: openAllPopups,
        closeAll: closeAllPopups,
        focus: focusCurrent,
        status: popupStatus,
        popups: popups,
        scan: scanAllPopups
    };

    console.log('🔥 CLAUDE 11 AKUN v3 loaded!');
    console.log('💡 Panggil __claude11.openAll() buka semua popup');
    console.log('💡 Panggil __claude11.next() next akun');
</script>

</body>
</html>
