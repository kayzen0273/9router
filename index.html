<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA RVO Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .container {
    text-align: center; padding: 40px;
    background: #1a1a1a; border-radius: 16px;
    border: 1px solid #2a2a2a;
    min-width: 320px; max-width: 440px;
  }
  h1 { font-size: 20px; margin-bottom: 8px; color: #fff; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 20px;
    font-size: 13px; margin-bottom: 20px;
  }
  .status.connected { background: #0a2e1a; color: #4ade80; }
  .status.disconnected { background: #2e0a0a; color: #f87171; }
  .dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 1.5s infinite; }
  .connected .dot { background: #4ade80; }
  .disconnected .dot { background: #f87171; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #qr-container { margin: 20px 0; }
  #qr-container img {
    width: 240px; height: 240px;
    border-radius: 12px; background: #fff; padding: 12px;
  }
  .placeholder {
    width: 240px; height: 240px; margin: 0 auto;
    border-radius: 12px; background: #0d0d0d;
    border: 2px dashed #333;
    display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 14px;
  }
  .hint { font-size: 12px; color: #555; margin-top: 16px; line-height: 1.6; }
  .hint code { background: #252525; padding: 2px 6px; border-radius: 4px; color: #c084fc; }
  .log {
    margin-top: 16px; padding: 12px; background: #0d0d0d;
    border-radius: 8px; font-size: 11px; color: #666;
    text-align: left; max-height: 120px; overflow-y: auto;
    font-family: monospace;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🤖 WA RVO Bot</h1>
    <p class="subtitle">Scan QR buat konek WhatsApp</p>
    <div class="status disconnected" id="status">
      <span class="dot"></span>
      <span id="status-text">Nunggu koneksi...</span>
    </div>
    <div id="qr-container">
      <div class="placeholder" id="placeholder">Loading...</div>
    </div>
    <p class="hint">
      Setelah konek, kirim <code>.rvo</code> di chat<br>
      buat ngambil pesan "sekali lihat" terakhir
    </p>
    <div class="log" id="log">> Menunggu server...</div>
  </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ==================== KONFIGURASI ====================
const SUPABASE_URL = 'https://zwqwomfrgtqyaiiugryg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3cXdvbWZyZ3RxeWFpaXVncnlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDUzODAsImV4cCI6MjEwNDc4MTM4MH0.Zs2egViPPVec5OeAUgCI0-nUG1ABCDi2fyhVTvHNmao';

// Ganti ke URL bot server lo (Railway/VPS)
const BOT_WS_URL = 'wss://your-bot-server.railway.app';

// ==================== SUPABASE ====================
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ==================== STATE ====================
let ws = null;
let reconnectTimer = null;

// ==================== DOM ====================
const statusEl = document.getElementById('status');
const statusText = document.getElementById('status-text');
const qrContainer = document.getElementById('qr-container');
const logEl = document.getElementById('log');

function log(msg) {
  logEl.textContent = '> ' + msg;
  console.log(msg);
}

// ==================== CEK SUPABASE ====================
async function testSupabase() {
  try {
    const { data, error } = await supabase
      .from('sessions')
      .select('count')
      .limit(1);
    
    if (error) {
      log('⚠️ Supabase: ' + error.message);
      return false;
    }
    log('✅ Supabase konek');
    return true;
  } catch (e) {
    log('❌ Supabase error: ' + e.message);
    return false;
  }
}

// ==================== WEBSOCKET KE BOT SERVER ====================
function connectWS() {
  log('Nyambung ke bot server...');
  ws = new WebSocket(BOT_WS_URL);

  ws.onopen = () => {
    log('✅ WebSocket konek');
    statusEl.className = 'status disconnected';
    statusText.textContent = '⏳ Nunggu QR dari server';
  };

  ws.onmessage = async (event) => {
    try {
      const data = JSON.parse(event.data);

      if (data.type === 'qr') {
        log('📱 QR Code diterima');
        qrContainer.innerHTML = `<img src="${data.qr}" alt="QR">`;
        statusEl.className = 'status disconnected';
        statusText.textContent = '⏳ Scan QR di WhatsApp';

        // Simpan QR ke Supabase (opsional)
        await supabase.from('sessions').upsert({
          id: 'current',
          qr: data.qr,
          status: 'waiting',
          updated_at: new Date().toISOString()
        });
      }

      if (data.type === 'connected') {
        log('✅ WhatsApp terhubung!');
        statusEl.className = 'status connected';
        statusText.textContent = '✅ Perangkat tertaut';
        qrContainer.innerHTML =
          '<div class="placeholder" style="border-color:#4ade80;color:#4ade80;">✅ Terhubung</div>';

        await supabase.from('sessions').upsert({
          id: 'current',
          qr: null,
          status: 'connected',
          updated_at: new Date().toISOString()
        });
      }

      if (data.type === 'disconnected') {
        log('❌ Terputus');
        statusEl.className = 'status disconnected';
        statusText.textContent = '❌ Terputus';
      }

      if (data.type === 'log') {
        log(data.message);
      }
    } catch (e) {
      console.error('Parse error:', e);
    }
  };

  ws.onerror = () => log('❌ WebSocket error');

  ws.onclose = () => {
    log('🔌 WebSocket tertutup, reconnect 3 detik...');
    statusEl.className = 'status disconnected';
    statusText.textContent = '🔌 Terputus dari server';
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWS, 3000);
  };
}

// ==================== START ====================
(async () => {
  await testSupabase();
  connectWS();
})();
</script>
</body>
</html>
