<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🔥 CLAUDE 11 AKUN - DASHBOARD v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            letter-spacing: 3px;
            border-bottom: 2px solid #00ff41;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #111;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #1a1a1a;
            margin-bottom: 20px;
        }
        .status-bar .active {
            font-size: 18px;
            color: #ffcc00;
        }
        .status-bar .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.online {
            background: #00ff41;
            color: #0a0a0a;
        }
        .badge.limit {
            background: #ff4444;
            color: #fff;
        }
        .badge.idle {
            background: #444;
            color: #aaa;
        }
        .badge.switching {
            background: #ffcc00;
            color: #0a0a0a;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #00ff41;
            color: #0a0a0a;
        }
        .btn.danger {
            border-color: #ff4444;
            color: #ff4444;
        }
        .btn.danger:hover {
            background: #ff4444;
            color: #0a0a0a;
        }
        .btn.warning {
            border-color: #ffcc00;
            color: #ffcc00;
        }
        .btn.warning:hover {
            background: #ffcc00;
            color: #0a0a0a;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin: 15px 0;
        }
        .account-card {
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .account-card:hover {
            border-color: #00ff41;
        }
        .account-card.active {
            border-color: #00ff41;
            box-shadow: 0 0 20px rgba(0,255,65,0.2);
        }
        .account-card .num {
            font-size: 11px;
            color: #666;
        }
        .account-card .email {
            font-size: 10px;
            color: #888;
            margin: 4px 0;
            word-break: break-all;
        }
        .account-card .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 4px;
        }
        .status-dot.online {
            background: #00ff41;
        }
        .status-dot.limit {
            background: #ff4444;
        }
        .status-dot.idle {
            background: #444;
        }
        .status-dot.used {
            background: #ffcc00;
        }
        .log {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
        .log span {
            display: block;
            padding: 2px 0;
            border-bottom: 1px solid #0d0d0d;
        }
        .log .hl {
            color: #00ff41;
        }
        .log .warn {
            color: #ffcc00;
        }
        .log .err {
            color: #ff4444;
        }
        .note {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 15px;
            border-top: 1px solid #1a1a1a;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 CLAUDE 11 AKUN - DASHBOARD v2</h1>

    <!-- Status Bar -->
    <div class="status-bar">
        <div>
            <span>📌 Akun Aktif: </span>
            <span class="active" id="activeLabel">Akun 1</span>
            <span class="badge online" id="statusBadge">Online</span>
        </div>
        <div>
            <span>🔄 Switch: <span id="switchCount">0</span>x</span>
        </div>
        <div class="btn-group">
            <button class="btn" id="btnPrev">◀ Prev</button>
            <button class="btn" id="btnNext">Next ▶</button>
            <button class="btn warning" id="btnOpenAll">🪟 Buka Semua</button>
            <button class="btn danger" id="btnLogoutAll">🚪 Logout All</button>
        </div>
    </div>

    <!-- Grid Akun -->
    <div class="grid" id="accountGrid"></div>

    <!-- Log -->
    <div class="log" id="logArea">
        <span class="hl">🔥 Dashboard siap. Klik "Buka Semua" untuk buka 11 tab Claude.</span>
    </div>

    <div class="note">
        ⚡ Klik kartu akun untuk pindah ke tab itu. <br/>
        🔥 Auto-detect limit dari tab Claude. Kena limit? Auto-switch ke akun berikutnya!
    </div>
</div>

<script>
    // ==================== KONFIG ====================
    const ACCOUNTS = [
        { id: 0, email: 'andre1@gmail.com', label: 'Akun 1' },
        { id: 1, email: 'andre2@gmail.com', label: 'Akun 2' },
        { id: 2, email: 'andre3@gmail.com', label: 'Akun 3' },
        { id: 3, email: 'andre4@gmail.com', label: 'Akun 4' },
        { id: 4, email: 'andre5@gmail.com', label: 'Akun 5' },
        { id: 5, email: 'andre6@gmail.com', label: 'Akun 6' },
        { id: 6, email: 'andre7@gmail.com', label: 'Akun 7' },
        { id: 7, email: 'andre8@gmail.com', label: 'Akun 8' },
        { id: 8, email: 'andre9@gmail.com', label: 'Akun 9' },
        { id: 9, email: 'andre10@gmail.com', label: 'Akun 10' },
        { id: 10, email: 'andre11@gmail.com', label: 'Akun 11' }
    ];

    const CHECK_INTERVAL = 3000;

    // ==================== STATE ====================
    let currentIndex = 0;
    let switchCount = 0;
    let isSwitching = false;
    let tabs = {}; // { tabId: window }
    let tabStatus = {}; // { tabId: 'online'|'limit'|'idle'|'used' }
    let tabFocus = {}; // { tabId: lastFocusTime }

    // ==================== DOM ====================
    const grid = document.getElementById('accountGrid');
    const logArea = document.getElementById('logArea');
    const activeLabel = document.getElementById('activeLabel');
    const statusBadge = document.getElementById('statusBadge');
    const switchCountEl = document.getElementById('switchCount');

    // ==================== FUNGSI ====================
    function addLog(msg, type = '') {
        const span = document.createElement('span');
        span.className = type;
        span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logArea.appendChild(span);
        logArea.scrollTop = logArea.scrollHeight;
        while (logArea.children.length > 80) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    function renderGrid() {
        grid.innerHTML = '';
        ACCOUNTS.forEach((acc, i) => {
            const div = document.createElement('div');
            div.className = `account-card ${i === currentIndex ? 'active' : ''}`;
            const status = tabStatus[acc.id] || 'idle';
            const dotClass = {
                'online': 'online',
                'limit': 'limit',
                'idle': 'idle',
                'used': 'used'
            }[status] || 'idle';

            div.innerHTML = `
                <div class="num">#${i+1}</div>
                <div class="email">${acc.label}</div>
                <div class="status-dot ${dotClass}"></div>
                <div style="font-size:9px;color:#666;margin-top:2px;">${status.toUpperCase()}</div>
            `;
            div.onclick = () => switchToAccount(i);
            grid.appendChild(div);
        });
    }

    function updateStatusBar() {
        const acc = ACCOUNTS[currentIndex];
        activeLabel.textContent = acc.label;
        const status = tabStatus[acc.id] || 'idle';
        statusBadge.textContent = status.toUpperCase();
        statusBadge.className = `badge ${status}`;
        switchCountEl.textContent = switchCount;
        renderGrid();
    }

    function switchToAccount(index) {
        if (isSwitching) return;
        if (index < 0 || index >= ACCOUNTS.length) return;

        const acc = ACCOUNTS[index];
        currentIndex = index;

        // Focus tab
        if (tabs[acc.id] && !tabs[acc.id].closed) {
            tabs[acc.id].focus();
            addLog(`🔄 Switch ke ${acc.label} (tab #${acc.id+1})`, 'hl');
        } else {
            // Tab ga ada, buka baru
            openTab(acc.id);
            addLog(`🔄 Buka tab baru: ${acc.label}`, 'hl');
        }

        updateStatusBar();
    }

    function nextAccount() {
        if (isSwitching) return;
        const next = (currentIndex + 1) % ACCOUNTS.length;
        switchCount++;
        switchToAccount(next);
    }

    function prevAccount() {
        if (isSwitching) return;
        const prev = (currentIndex - 1 + ACCOUNTS.length) % ACCOUNTS.length;
        switchCount++;
        switchToAccount(prev);
    }

    function openTab(accountId) {
        const acc = ACCOUNTS[accountId];
        const win = window.open(
            `https://claude.ai/login?email=${encodeURIComponent(acc.email)}`,
            `claude_${acc.id}`,
            'width=1200,height=800'
        );
        if (win) {
            tabs[acc.id] = win;
            tabStatus[acc.id] = 'idle';
            // Monitor tab close
            const checkClosed = setInterval(() => {
                if (win.closed) {
                    clearInterval(checkClosed);
                    tabStatus[acc.id] = 'idle';
                    addLog(`❌ Tab ${acc.label} ditutup`, 'err');
                    renderGrid();
                }
            }, 2000);
        } else {
            addLog(`⚠️ Popup blocked! Buka manual: ${acc.email}`, 'warn');
        }
        renderGrid();
        updateStatusBar();
    }

    function openAllTabs() {
        addLog(`🪟 Membuka ${ACCOUNTS.length} tab Claude...`, 'warn');
        ACCOUNTS.forEach((acc, i) => {
            setTimeout(() => {
                openTab(acc.id);
                addLog(`  📧 Tab #${i+1}: ${acc.label}`, '');
            }, i * 500);
        });
        setTimeout(() => {
            addLog(`✅ Semua tab dibuka!`, 'hl');
        }, ACCOUNTS.length * 500 + 1000);
    }

    function logoutAll() {
        if (!confirm('🚪 Logout semua akun Claude?')) return;
        addLog('🚪 Logout semua akun...', 'warn');
        ACCOUNTS.forEach(acc => {
            if (tabs[acc.id] && !tabs[acc.id].closed) {
                try {
                    tabs[acc.id].location.href = 'https://claude.ai/logout';
                } catch(e) {
                    // Cross-origin, close tab aja
                    tabs[acc.id].close();
                }
            }
            tabStatus[acc.id] = 'idle';
            delete tabs[acc.id];
        });
        renderGrid();
        updateStatusBar();
        addLog('✅ Semua akun logout', 'hl');
    }

    // ==================== DETECT LIMIT ====================
    function checkAllTabs() {
        if (isSwitching) return;

        let anyLimit = false;
        let firstLimitId = -1;

        ACCOUNTS.forEach(acc => {
            const win = tabs[acc.id];
            if (!win || win.closed) {
                tabStatus[acc.id] = 'idle';
                return;
            }

            try {
                // Cek title atau URL
                const title = win.document.title || '';
                const url = win.location.href || '';

                // Limit indicators
                const limitPatterns = [
                    'limit', 'exceeded', 'too many', 'try again',
                    'rate limit', 'unavailable', 'usage limit',
                    'monthly limit', 'daily limit', 'message limit',
                    'you\'ve reached', 'can\'t send', 'request failed',
                    'over quota', 'throttled', 'temporarily blocked'
                ];

                let isLimit = false;
                const lowerTitle = title.toLowerCase();
                const lowerUrl = url.toLowerCase();

                for (const pattern of limitPatterns) {
                    if (lowerTitle.includes(pattern) || lowerUrl.includes(pattern)) {
                        isLimit = true;
                        break;
                    }
                }

                // Cek body text
                try {
                    const body = win.document.body?.innerText || '';
                    for (const pattern of limitPatterns) {
                        if (body.toLowerCase().includes(pattern)) {
                            isLimit = true;
                            break;
                        }
                    }
                } catch(e) {}

                if (isLimit) {
                    if (tabStatus[acc.id] !== 'limit') {
                        tabStatus[acc.id] = 'limit';
                        addLog(`🚨 ${acc.label} KENA LIMIT!`, 'err');
                    }
                    anyLimit = true;
                    if (firstLimitId === -1) firstLimitId = acc.id;
                } else {
                    if (tabStatus[acc.id] !== 'online' && tabStatus[acc.id] !== 'used') {
                        tabStatus[acc.id] = 'online';
                        addLog(`✅ ${acc.label} Online`, 'hl');
                    }
                }

            } catch(e) {
                // Cross-origin, skip
                // Tapi kita bisa cek dari URL via location (cuma bisa baca URL)
                try {
                    const url = win.location.href || '';
                    if (url.includes('limit') || url.includes('error') || url.includes('blocked')) {
                        if (tabStatus[acc.id] !== 'limit') {
                            tabStatus[acc.id] = 'limit';
                            addLog(`🚨 ${acc.label} KENA LIMIT!`, 'err');
                        }
                        anyLimit = true;
                        if (firstLimitId === -1) firstLimitId = acc.id;
                    }
                } catch(e2) {
                    // Silent
                }
            }
        });

        renderGrid();
        updateStatusBar();

        // Kalo ada limit, auto-switch ke akun berikutnya
        if (anyLimit && firstLimitId !== -1) {
            const currentAcc = ACCOUNTS[currentIndex];
            if (tabStatus[currentAcc.id] === 'limit') {
                addLog(`⚠️ Akun aktif kena limit! Auto-switch...`, 'warn');
                isSwitching = true;
                setTimeout(() => {
                    nextAccount();
                    isSwitching = false;
                }, 2000);
            }
        }
    }

    // ==================== KEYBOARD ====================
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' && e.ctrlKey) {
            e.preventDefault();
            nextAccount();
        }
        if (e.key === 'ArrowLeft' && e.ctrlKey) {
            e.preventDefault();
            prevAccount();
        }
    });

    // ==================== INIT ====================
    function init() {
        // Load saved index
        try {
            const saved = localStorage.getItem('claude_11_index_v2');
            if (saved !== null) {
                const idx = parseInt(saved);
                if (!isNaN(idx) && idx >= 0 && idx < ACCOUNTS.length) {
                    currentIndex = idx;
                }
            }
        } catch(e) {}

        renderGrid();
        updateStatusBar();

        // Events
        document.getElementById('btnNext').addEventListener('click', () => {
            if (!isSwitching) nextAccount();
        });
        document.getElementById('btnPrev').addEventListener('click', () => {
            if (!isSwitching) prevAccount();
        });
        document.getElementById('btnOpenAll').addEventListener('click', openAllTabs);
        document.getElementById('btnLogoutAll').addEventListener('click', logoutAll);

        // Auto-check loop
        setInterval(checkAllTabs, CHECK_INTERVAL);

        // Save index
        setInterval(() => {
            try {
                localStorage.setItem('claude_11_index_v2', currentIndex);
            } catch(e) {}
        }, 10000);

        addLog(`🔥 CLAUDE 11 AKUN v2 siap! Total ${ACCOUNTS.length} akun.`, 'hl');
        addLog(`💡 Klik "Buka Semua" untuk buka 11 tab login.`, '');
        addLog(`⌨️ Ctrl+→ / Ctrl+← buat ganti akun.`, '');
    }

    init();

    // ==================== GLOBAL ====================
    window.__claude11 = {
        accounts: ACCOUNTS,
        switchTo: switchToAccount,
        next: nextAccount,
        prev: prevAccount,
        openAll: openAllTabs,
        logoutAll: logoutAll,
        status: tabStatus,
        tabs: tabs,
        check: checkAllTabs
    };

    console.log('🔥 CLAUDE 11 AKUN v2 loaded!');
    console.log('💡 Panggil __claude11.next() buat next akun');
    console.log('💡 Panggil __claude11.openAll() buka semua tab');
</script>

</body>
</html>
