<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA RVO Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .container {
    text-align: center; padding: 40px;
    background: #1a1a1a; border-radius: 16px;
    border: 1px solid #2a2a2a;
    min-width: 320px; max-width: 440px; width: 100%;
  }
  h1 { font-size: 20px; margin-bottom: 8px; color: #fff; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 20px;
    font-size: 13px; margin-bottom: 20px;
  }
  .status.connected { background: #0a2e1a; color: #4ade80; }
  .status.disconnected { background: #2e0a0a; color: #f87171; }
  .dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 1.5s infinite; }
  .connected .dot { background: #4ade80; }
  .disconnected .dot { background: #f87171; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #qr-container { margin: 20px 0; }
  #qr-container img {
    width: 240px; height: 240px;
    border-radius: 12px; background: #fff; padding: 12px;
  }
  .placeholder {
    width: 240px; height: 240px; margin: 0 auto;
    border-radius: 12px; background: #0d0d0d;
    border: 2px dashed #333;
    display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 14px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 20px; border-radius: 8px;
    border: none; font-weight: 600; font-size: 13px;
    cursor: pointer; margin: 4px;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-bt { background: #c084fc; color: #0a0a0a; }
  .btn-print { background: #4ade80; color: #0a0a0a; }
  .btn-pair { background: #c084fc; color: #0a0a0a; width: 100%; }
  .pair-box {
    margin-top: 20px; padding: 16px;
    background: #0d0d0d; border-radius: 10px;
    border: 1px solid #2a2a2a;
  }
  .pair-box h3 { font-size: 13px; color: #888; margin-bottom: 12px; font-weight: 500; }
  .pair-input {
    width: 100%; padding: 10px 12px;
    background: #1a1a1a; border: 1px solid #333;
    border-radius: 8px; color: #fff; font-size: 14px;
    margin-bottom: 10px; outline: none;
  }
  .pair-input:focus { border-color: #c084fc; }
  .pair-code {
    margin-top: 12px; padding: 12px;
    background: #0a2e1a; color: #4ade80;
    border-radius: 8px; font-size: 18px;
    font-weight: 700; letter-spacing: 2px;
    font-family: monospace;
  }
  .hint { font-size: 12px; color: #555; margin-top: 16px; line-height: 1.6; }
  .hint code { background: #252525; padding: 2px 6px; border-radius: 4px; color: #c084fc; }
  .log {
    margin-top: 16px; padding: 12px; background: #0d0d0d;
    border-radius: 8px; font-size: 11px; color: #666;
    text-align: left; max-height: 120px; overflow-y: auto;
    font-family: monospace;
  }
  .print-buttons { margin-top: 16px; }
</style>
</head>
<body>
  <div class="container">
    <h1>🤖 WA RVO Bot</h1>
    <p class="subtitle">Scan QR atau pake kode 8 digit</p>
    
    <div class="status disconnected" id="status">
      <span class="dot"></span>
      <span id="status-text">Nunggu koneksi...</span>
    </div>

    <div id="qr-container">
      <div class="placeholder">Loading...</div>
    </div>

    <div class="print-buttons">
      <button class="btn btn-bt" id="printBtBtn" disabled>🖨️ Cetak via Bluetooth</button>
      <button class="btn btn-print" id="printBrowserBtn" disabled>🖨️ Cetak via Browser</button>
    </div>

    <div class="pair-box">
      <h3>🔑 Pairing Code (8 Digit)</h3>
      <input class="pair-input" id="phoneInput" type="tel" placeholder="62812xxxxxxx" />
      <button class="btn btn-pair" id="pairBtn">Minta Kode</button>
      <div id="pairCodeDisplay"></div>
    </div>

    <p class="hint">
      Setelah konek, kirim <code>.rvo</code> di chat
    </p>
    <div class="log" id="log">> Menunggu server...</div>
  </div>

<script>
const BOT_WS_URL = 'wss://9router-production-46d3.up.railway.app';
const BOT_HTTP_URL = 'https://9router-production-46d3.up.railway.app';

let ws = null;
let reconnectTimer = null;
let currentQR = null;

const statusEl = document.getElementById('status');
const statusText = document.getElementById('status-text');
const qrContainer = document.getElementById('qr-container');
const logEl = document.getElementById('log');
const phoneInput = document.getElementById('phoneInput');
const pairBtn = document.getElementById('pairBtn');
const pairCodeDisplay = document.getElementById('pairCodeDisplay');
const printBtBtn = document.getElementById('printBtBtn');
const printBrowserBtn = document.getElementById('printBrowserBtn');

function log(msg) { logEl.textContent = '> ' + msg; }

// ==================== PRINT VIA BLUETOOTH ====================
async function printQRBluetooth() {
  if (!currentQR) { log('❌ QR belum ada'); return; }
  if (!navigator.bluetooth) { log('❌ Browser gak support Bluetooth. Pakai Chrome!'); return; }

  try {
    log('🔍 Nyari printer Bluetooth...');
    
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        '000018f0-0000-1000-8000-00805f9b34fb',
        '0000ff00-0000-1000-8000-00805f9b34fb',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
      ]
    });

    log('✅ Ketemu: ' + device.name);
    const server = await device.gatt.connect();
    log('🔗 Konek ke GATT...');

    const services = await server.getPrimaryServices();
    let writeChar = null;

    for (const service of services) {
      const chars = await service.getCharacteristics();
      for (const c of chars) {
        if (c.properties.write || c.properties.writeWithoutResponse) {
          writeChar = c;
          break;
        }
      }
      if (writeChar) break;
    }

    if (!writeChar) { log('❌ Printer gak punya karakteristik write'); return; }

    log('📝 Nyiapin data QR...');
    const img = new Image();
    img.src = currentQR;
    await new Promise(r => img.onload = r);

    const escposData = await convertToESCPOS(img);
    
    const chunkSize = 100;
    for (let i = 0; i < escposData.length; i += chunkSize) {
      const chunk = escposData.slice(i, i + chunkSize);
      await writeChar.writeValue(chunk);
    }

    log('✅ QR terkirim ke printer!');
  } catch (e) {
    log('❌ Error: ' + e.message);
  }
}

async function convertToESCPOS(img) {
  const targetWidth = 384;
  const scale = targetWidth / img.width;
  const targetHeight = Math.floor(img.height * scale);

  const canvas = document.createElement('canvas');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, targetWidth, targetHeight);
  ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

  const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight).data;
  const bytesPerRow = targetWidth / 8;
  const bitmap = [];

  bitmap.push(0x1B, 0x40);
  bitmap.push(0x1B, 0x61, 0x01);
  bitmap.push(0x1D, 0x76, 0x30, 0x00);
  bitmap.push(bytesPerRow & 0xFF, (bytesPerRow >> 8) & 0xFF);
  bitmap.push(targetHeight & 0xFF, (targetHeight >> 8) & 0xFF);

  for (let y = 0; y < targetHeight; y++) {
    for (let x = 0; x < targetWidth; x += 8) {
      let byte = 0;
      for (let bit = 0; bit < 8; bit++) {
        const px = x + bit;
        if (px >= targetWidth) continue;
        const idx = (y * targetWidth + px) * 4;
        const gray = (imageData[idx] + imageData[idx+1] + imageData[idx+2]) / 3;
        if (gray < 128) byte |= (0x80 >> bit);
      }
      bitmap.push(byte);
    }
  }

  bitmap.push(0x0A, 0x0A, 0x0A);
  bitmap.push(0x1D, 0x56, 0x42, 0x00);

  return new Uint8Array(bitmap);
}

// ==================== PRINT VIA BROWSER ====================
function printQRBrowser() {
  if (!currentQR) { log('❌ QR belum ada'); return; }
  
  const w = window.open('', '_blank');
  w.document.write(`
    <html>
    <head>
      <title>Print QR - WA RVO Bot</title>
      <style>
        body { 
          display: flex; justify-content: center; align-items: center;
          min-height: 100vh; margin: 0; font-family: sans-serif;
        }
        img { width: 400px; height: 400px; }
      </style>
    </head>
    <body>
      <img src="${currentQR}" onload="window.print(); window.close();">
    </body>
    </html>
  `);
  w.document.close();
  log('🖨️ Print dialog dibuka');
}

// ==================== PAIRING CODE ====================
pairBtn.addEventListener('click', async () => {
  const phone = phoneInput.value.trim();
  if (!phone) { log('❌ Isi nomor HP dulu'); return; }
  
  pairBtn.disabled = true;
  pairBtn.textContent = 'Loading...';
  pairCodeDisplay.innerHTML = '';
  
  try {
    log('🔑 Minta kode pairing...');
    const res = await fetch(BOT_HTTP_URL + '/pair?phone=' + encodeURIComponent(phone));
    const data = await res.json();
    
    if (data.error) {
      log('❌ ' + data.error);
      pairCodeDisplay.innerHTML = '<div style="color:#f87171;font-size:13px;">❌ ' + data.error + '</div>';
    } else {
      log('✅ Kode: ' + data.code);
      pairCodeDisplay.innerHTML = '<div class="pair-code">' + data.code + '</div>';
    }
  } catch (e) {
    log('❌ Error: ' + e.message);
  }
  
  pairBtn.disabled = false;
  pairBtn.textContent = 'Minta Kode';
});

// ==================== WEBSOCKET ====================
function connectWS() {
  log('Nyambung ke server...');
  ws = new WebSocket(BOT_WS_URL);

  ws.onopen = () => {
    log('✅ Server konek');
    statusText.textContent = '⏳ Nunggu QR / Pairing';
  };

  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      
      if (data.type === 'qr') {
        log('📱 QR Code diterima');
        currentQR = data.qr;
        qrContainer.innerHTML = '<img src="' + data.qr + '" alt="QR">';
        statusText.textContent = '⏳ Scan QR / pake pairing code';
        printBtBtn.disabled = false;
        printBrowserBtn.disabled = false;
      }
      
      if (data.type === 'pairing') {
        log('🔑 Kode pairing: ' + data.code);
        pairCodeDisplay.innerHTML = '<div class="pair-code">' + data.code + '</div>';
      }
      
      if (data.type === 'connected') {
        log('✅ WhatsApp terhubung!');
        statusEl.className = 'status connected';
        statusText.textContent = '✅ Perangkat tertaut';
        qrContainer.innerHTML = '<div class="placeholder" style="border-color:#4ade80;color:#4ade80;">✅ Terhubung</div>';
        pairCodeDisplay.innerHTML = '';
        printBtBtn.disabled = true;
        printBrowserBtn.disabled = true;
        currentQR = null;
      }
      
      if (data.type === 'disconnected') {
        log('❌ Terputus');
        statusEl.className = 'status disconnected';
        statusText.textContent = '❌ Terputus';
      }
    } catch (e) { console.error(e); }
  };

  ws.onerror = () => log('❌ Server error');
  ws.onclose = () => {
    log('🔌 Terputus, reconnect...');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWS, 3000);
  };
}

printBtBtn.addEventListener('click', printQRBluetooth);
printBrowserBtn.addEventListener('click', printQRBrowser);
connectWS();
</script>
</body>
</html>
