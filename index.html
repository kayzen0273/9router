<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>🔥 Claude HP Switcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 100px;
        }
        h1 {
            font-size: 20px;
            text-align: center;
            border-bottom: 2px solid #00ff41;
            padding-bottom: 12px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .status-box {
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .status-box .active {
            font-size: 18px;
            color: #ffcc00;
            word-break: break-all;
        }
        .status-box .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
        }
        .badge.online { background: #00ff41; color: #000; }
        .badge.limit { background: #ff4444; color: #fff; }
        .badge.idle { background: #444; color: #aaa; }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }
        .btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 14px 8px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .btn:active { background: #00ff41; color: #000; transform: scale(0.95); }
        .btn.danger { border-color: #ff4444; color: #ff4444; }
        .btn.danger:active { background: #ff4444; color: #000; }
        .btn.warning { border-color: #ffcc00; color: #ffcc00; }
        .btn.warning:active { background: #ffcc00; color: #000; }
        .btn.full { grid-column: 1 / -1; }
        .account-list {
            margin-top: 12px;
        }
        .account-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #111;
            border-radius: 6px;
            margin-bottom: 4px;
            border-left: 3px solid #333;
            font-size: 13px;
        }
        .account-item.active {
            border-left-color: #00ff41;
            background: #1a1a1a;
        }
        .account-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: #00ff41; }
        .dot.limit { background: #ff4444; }
        .dot.idle { background: #444; }
        .log {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 11px;
            color: #666;
            margin-top: 12px;
        }
        .log span { display: block; padding: 2px 0; border-bottom: 1px solid #0d0d0d; }
        .log .hl { color: #00ff41; }
        .log .err { color: #ff4444; }
        .log .warn { color: #ffcc00; }
        .note {
            font-size: 11px;
            color: #444;
            text-align: center;
            margin-top: 15px;
            border-top: 1px solid #1a1a1a;
            padding-top: 15px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #00ff41;
            font-size: 14px;
            margin: 5px 0;
        }
        input::placeholder { color: #444; }
    </style>
</head>
<body>

<h1>🔥 CLAUDE HP SWITCHER</h1>

<div class="status-box">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
        <span>📌 Akun Aktif</span>
        <span class="badge idle" id="statusBadge">IDLE</span>
    </div>
    <div class="active" id="activeLabel">-</div>
    <div style="font-size:12px;color:#666;margin-top:5px;">
        🔄 Switch: <span id="switchCount">0</span>x
    </div>
</div>

<div class="btn-group">
    <button class="btn" id="btnPrev">◀ Prev</button>
    <button class="btn" id="btnNext">Next ▶</button>
    <button class="btn warning" id="btnSwitch">🔄 Switch</button>
    <button class="btn full" id="btnOpenLogin">🔐 Buka Claude Login</button>
    <button class="btn full danger" id="btnReset">⟳ Reset Ke Akun 1</button>
</div>

<div class="account-list" id="accountList"></div>

<div class="log" id="logArea">
    <span class="hl">🔥 Dashboard HP siap!</span>
    <span>💡 Tap "Switch" buat pindah akun</span>
</div>

<div class="note">
    📌 Data tersimpan di HP lo.<br/>
    🔥 Kalo kena limit, tap "Switch" → langsung pindah akun!
</div>

<script>
    // ==================== KONFIG ====================
    const ACCOUNTS = [
        'andre1@gmail.com',
        'andre2@gmail.com',
        'andre3@gmail.com',
        'andre4@gmail.com',
        'andre5@gmail.com',
        'andre6@gmail.com',
        'andre7@gmail.com',
        'andre8@gmail.com',
        'andre9@gmail.com',
        'andre10@gmail.com',
        'andre11@gmail.com'
    ];

    // ==================== STATE ====================
    let currentIndex = parseInt(localStorage.getItem('claude_hp_idx') || '0');
    let switchCount = parseInt(localStorage.getItem('claude_hp_switch_count') || '0');

    // ==================== DOM ====================
    const activeLabel = document.getElementById('activeLabel');
    const statusBadge = document.getElementById('statusBadge');
    const switchCountEl = document.getElementById('switchCount');
    const accountList = document.getElementById('accountList');
    const logArea = document.getElementById('logArea');

    // ==================== FUNGSI ====================
    function addLog(msg, type = '') {
        const span = document.createElement('span');
        span.className = type;
        span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logArea.appendChild(span);
        logArea.scrollTop = logArea.scrollHeight;
        while (logArea.children.length > 50) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    function renderAccounts() {
        accountList.innerHTML = '';
        ACCOUNTS.forEach((email, i) => {
            const div = document.createElement('div');
            div.className = `account-item ${i === currentIndex ? 'active' : ''}`;
            const status = localStorage.getItem(`claude_status_${i}`) || 'idle';
            const dotClass = { 'online': 'online', 'limit': 'limit', 'idle': 'idle' }[status] || 'idle';
            div.innerHTML = `
                <span>#${i+1} ${email.length > 20 ? email.slice(0,20)+'...' : email}</span>
                <span><span class="dot ${dotClass}"></span> ${status.toUpperCase()}</span>
            `;
            div.onclick = () => switchTo(i);
            accountList.appendChild(div);
        });
    }

    function updateUI() {
        const email = ACCOUNTS[currentIndex] || '-';
        activeLabel.textContent = email;
        const status = localStorage.getItem(`claude_status_${currentIndex}`) || 'idle';
        statusBadge.textContent = status.toUpperCase();
        statusBadge.className = `badge ${status}`;
        switchCountEl.textContent = switchCount;
        renderAccounts();
        // Save
        localStorage.setItem('claude_hp_idx', currentIndex);
        localStorage.setItem('claude_hp_switch_count', switchCount);
    }

    function switchTo(index) {
        if (index < 0 || index >= ACCOUNTS.length) return;
        currentIndex = index;
        switchCount++;
        updateUI();
        addLog(`🔄 Pindah ke Akun ${index+1}: ${ACCOUNTS[index]}`, 'hl');
        
        // Update status ke online
        localStorage.setItem(`claude_status_${index}`, 'online');
        // Reset status akun lain ke idle
        ACCOUNTS.forEach((_, i) => {
            if (i !== index) {
                const s = localStorage.getItem(`claude_status_${i}`);
                if (s === 'online') localStorage.setItem(`claude_status_${i}`, 'idle');
            }
        });
        renderAccounts();
    }

    function nextAccount() {
        const next = (currentIndex + 1) % ACCOUNTS.length;
        switchTo(next);
    }

    function prevAccount() {
        const prev = (currentIndex - 1 + ACCOUNTS.length) % ACCOUNTS.length;
        switchTo(prev);
    }

    function switchAndGo() {
        const email = ACCOUNTS[currentIndex];
        // Tandai akun ini sebagai limit
        localStorage.setItem(`claude_status_${currentIndex}`, 'limit');
        renderAccounts();
        addLog(`🚨 Switch dari limit: ${email}`, 'err');
        
        // Pindah ke akun berikutnya
        setTimeout(() => {
            nextAccount();
            // Buka Claude dengan email baru
            setTimeout(() => {
                window.location.href = 'https://claude.ai/login?email=' + encodeURIComponent(ACCOUNTS[currentIndex]);
            }, 500);
        }, 500);
    }

    function openLogin() {
        const email = ACCOUNTS[currentIndex];
        window.location.href = 'https://claude.ai/login?email=' + encodeURIComponent(email);
        addLog(`🔐 Buka login: ${email}`, '');
    }

    function resetToFirst() {
        if (confirm('⟳ Reset ke akun 1?')) {
            currentIndex = 0;
            switchCount = 0;
            ACCOUNTS.forEach((_, i) => {
                localStorage.setItem(`claude_status_${i}`, 'idle');
            });
            updateUI();
            addLog('⟳ Reset ke akun 1', 'warn');
        }
    }

    // ==================== DETECT LIMIT DI HALAMAN CLAUDE ====================
    function detectLimit() {
        const body = document.body?.innerText || '';
        const patterns = ['limit','exceeded','too many','rate limit','unavailable','usage limit'];
        for (const p of patterns) {
            if (body.toLowerCase().includes(p)) {
                const idx = parseInt(localStorage.getItem('claude_hp_idx') || '0');
                localStorage.setItem(`claude_status_${idx}`, 'limit');
                renderAccounts();
                addLog(`🚨 Akun ${idx+1} KENA LIMIT!`, 'err');
                return true;
            }
        }
        return false;
    }

    // ==================== INIT ====================
    function init() {
        // Cek kalo di halaman Claude
        if (window.location.hostname.includes('claude')) {
            // Cek limit
            setTimeout(() => {
                if (detectLimit()) {
                    // Auto-switch
                    setTimeout(() => {
                        nextAccount();
                        setTimeout(() => {
                            window.location.href = 'https://claude.ai/login?email=' + encodeURIComponent(ACCOUNTS[currentIndex]);
                        }, 500);
                    }, 1500);
                } else {
                    // Tandai online
                    const idx = parseInt(localStorage.getItem('claude_hp_idx') || '0');
                    localStorage.setItem(`claude_status_${idx}`, 'online');
                    renderAccounts();
                    addLog(`✅ Akun ${idx+1} Online`, 'hl');
                }
            }, 2000);
        }

        updateUI();
        addLog(`🔥 Claude HP Switcher siap! ${ACCOUNTS.length} akun`, 'hl');
        addLog(`📌 Aktif: ${ACCOUNTS[currentIndex]}`, '');
        addLog(`💡 Tap "Switch" buat pindah + buka Claude`, '');
    }

    // ==================== EVENT ====================
    document.getElementById('btnNext').addEventListener('click', () => {
        nextAccount();
        addLog(`⏩ Next ke akun ${currentIndex+1}`, '');
    });
    document.getElementById('btnPrev').addEventListener('click', () => {
        prevAccount();
        addLog(`⏪ Prev ke akun ${currentIndex+1}`, '');
    });
    document.getElementById('btnSwitch').addEventListener('click', switchAndGo);
    document.getElementById('btnOpenLogin').addEventListener('click', openLogin);
    document.getElementById('btnReset').addEventListener('click', resetToFirst);

    // ==================== RUN ====================
    init();

    // ==================== GLOBAL ====================
    window.__claudeHP = {
        accounts: ACCOUNTS,
        current: () => ACCOUNTS[currentIndex],
        switchTo: switchTo,
        next: nextAccount,
        prev: prevAccount,
        switchAndGo: switchAndGo,
        detectLimit: detectLimit
    };

    console.log('🔥 CLAUDE HP SWITCHER loaded!');
    console.log('💡 Panggil __claudeHP.switchAndGo() buat pindah akun');
</script>

</body>
</html>
