<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🔥 CLAUDE 11 AKUN - DASHBOARD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            height: 100vh;
            overflow: hidden;
        }
        .topbar {
            background: #111;
            border-bottom: 2px solid #00ff41;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
        }
        .topbar h1 {
            font-size: 18px;
            letter-spacing: 2px;
        }
        .topbar .info {
            display: flex;
            gap: 15px;
            font-size: 13px;
            align-items: center;
            flex-wrap: wrap;
        }
        .topbar .info .badge {
            background: #00ff41;
            color: #0a0a0a;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
        }
        .topbar .info .badge.warning {
            background: #ffcc00;
        }
        .topbar .info .badge.danger {
            background: #ff4444;
        }
        .btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 5px 12px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #00ff41;
            color: #0a0a0a;
        }
        .btn.danger {
            border-color: #ff4444;
            color: #ff4444;
        }
        .btn.danger:hover {
            background: #ff4444;
            color: #0a0a0a;
        }
        .main {
            display: flex;
            height: calc(100vh - 60px);
            margin-top: 60px;
        }
        .sidebar {
            width: 220px;
            background: #0d0d0d;
            border-right: 1px solid #1a1a1a;
            padding: 10px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar .account-item {
            padding: 8px 10px;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            border-left: 3px solid #333;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar .account-item:hover {
            background: #1a1a1a;
        }
        .sidebar .account-item.active {
            border-left-color: #00ff41;
            background: #1a1a1a;
        }
        .sidebar .account-item .status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
        }
        .sidebar .account-item .status.online {
            background: #00ff41;
            color: #0a0a0a;
        }
        .sidebar .account-item .status.limit {
            background: #ff4444;
            color: #fff;
        }
        .sidebar .account-item .status.idle {
            background: #666;
            color: #fff;
        }
        .sidebar .account-item .status.used {
            background: #ffcc00;
            color: #0a0a0a;
        }
        .iframe-container {
            flex: 1;
            position: relative;
            background: #0a0a0a;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .iframe-container .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            color: #fff;
        }
        .iframe-container .overlay.show {
            display: flex;
        }
        .iframe-container .overlay .big {
            font-size: 48px;
        }
        .log-area {
            position: fixed;
            bottom: 0;
            left: 220px;
            right: 0;
            height: 80px;
            background: rgba(0,0,0,0.9);
            border-top: 1px solid #1a1a1a;
            padding: 5px 15px;
            overflow-y: auto;
            font-size: 11px;
            color: #888;
            z-index: 100;
        }
        .log-area span {
            display: block;
            padding: 1px 0;
        }
        .log-area .highlight {
            color: #00ff41;
        }
        .log-area .warn {
            color: #ffcc00;
        }
        .log-area .error {
            color: #ff4444;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 160px;
                font-size: 11px;
            }
            .topbar h1 {
                font-size: 14px;
            }
            .log-area {
                left: 160px;
                height: 60px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <h1>🔥 CLAUDE 11 AKUN</h1>
    <div class="info">
        <span id="activeInfo">📌 Akun: <strong id="activeName">-</strong></span>
        <span id="statusInfo">📊 Status: <span class="badge" id="statusBadge">Idle</span></span>
        <span>🔄 <span id="switchCount">0</span>x switch</span>
        <button class="btn" id="btnPrev">◀ Prev</button>
        <button class="btn" id="btnNext">Next ▶</button>
        <button class="btn danger" id="btnLogoutAll">🚪 Logout All</button>
        <button class="btn" id="btnRefreshAll">⟳ Refresh All</button>
    </div>
</div>

<!-- MAIN -->
<div class="main">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar"></div>

    <!-- IFRAME -->
    <div class="iframe-container">
        <iframe id="mainFrame" src="about:blank"></iframe>
        <div class="overlay" id="overlay">
            <div class="big">🔒</div>
            <div>Akun ini terkena limit. Switch otomatis dalam 3 detik...</div>
            <div id="countdownTimer">3</div>
        </div>
    </div>
</div>

<!-- LOG -->
<div class="log-area" id="logArea"></div>

<script>
    // ==================== KONFIG ====================
    const ACCOUNTS = [
        { email: 'andre1@gmail.com', label: 'Akun 1' },
        { email: 'andre2@gmail.com', label: 'Akun 2' },
        { email: 'andre3@gmail.com', label: 'Akun 3' },
        { email: 'andre4@gmail.com', label: 'Akun 4' },
        { email: 'andre5@gmail.com', label: 'Akun 5' },
        { email: 'andre6@gmail.com', label: 'Akun 6' },
        { email: 'andre7@gmail.com', label: 'Akun 7' },
        { email: 'andre8@gmail.com', label: 'Akun 8' },
        { email: 'andre9@gmail.com', label: 'Akun 9' },
        { email: 'andre10@gmail.com', label: 'Akun 10' },
        { email: 'andre11@gmail.com', label: 'Akun 11' }
    ];

    const CHECK_INTERVAL = 3000; // cek limit tiap 3 detik
    const AUTO_SWITCH_DELAY = 3000; // delay sebelum switch kalo limit

    // ==================== STATE ====================
    let currentIndex = 0;
    let switchCount = 0;
    let isSwitching = false;
    let countdownTimer = null;
    let accountStatus = {};

    // ==================== DOM ====================
    const mainFrame = document.getElementById('mainFrame');
    const sidebar = document.getElementById('sidebar');
    const logArea = document.getElementById('logArea');
    const activeName = document.getElementById('activeName');
    const statusBadge = document.getElementById('statusBadge');
    const switchCountEl = document.getElementById('switchCount');
    const overlay = document.getElementById('overlay');
    const countdownTimerEl = document.getElementById('countdownTimer');

    // ==================== FUNGSI ====================
    function addLog(msg, type = '') {
        const span = document.createElement('span');
        span.className = type;
        span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logArea.appendChild(span);
        logArea.scrollTop = logArea.scrollHeight;
        while (logArea.children.length > 100) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    function updateSidebar() {
        sidebar.innerHTML = '';
        ACCOUNTS.forEach((acc, i) => {
            const div = document.createElement('div');
            div.className = `account-item ${i === currentIndex ? 'active' : ''}`;
            const status = accountStatus[acc.email] || 'idle';
            const statusMap = {
                'online': '<span class="status online">● Online</span>',
                'limit': '<span class="status limit">● Limit</span>',
                'idle': '<span class="status idle">● Idle</span>',
                'used': '<span class="status used">● Used</span>'
            };
            div.innerHTML = `
                <span>${i+1}. ${acc.label}</span>
                ${statusMap[status] || statusMap.idle}
            `;
            div.onclick = () => switchToAccount(i);
            sidebar.appendChild(div);
        });
    }

    function switchToAccount(index) {
        if (isSwitching) return;
        if (index < 0 || index >= ACCOUNTS.length) return;

        currentIndex = index;
        const acc = ACCOUNTS[currentIndex];
        activeName.textContent = acc.label;
        statusBadge.textContent = accountStatus[acc.email] || 'Idle';
        switchCountEl.textContent = switchCount;

        // Update sidebar
        updateSidebar();

        // Load iframe
        mainFrame.src = `https://claude.ai/login?email=${encodeURIComponent(acc.email)}`;

        // Sembunyikan overlay
        overlay.classList.remove('show');

        addLog(`🔄 Switch ke ${acc.label} (${acc.email})`, 'highlight');
    }

    function nextAccount() {
        if (isSwitching) return;
        const next = (currentIndex + 1) % ACCOUNTS.length;
        switchToAccount(next);
        switchCount++;
        switchCountEl.textContent = switchCount;
    }

    function prevAccount() {
        if (isSwitching) return;
        const prev = (currentIndex - 1 + ACCOUNTS.length) % ACCOUNTS.length;
        switchToAccount(prev);
        switchCount++;
        switchCountEl.textContent = switchCount;
    }

    // ==================== DETECT LIMIT DI IFRAME ====================
    function checkIframeForLimit() {
        try {
            const iframeDoc = mainFrame.contentDocument || mainFrame.contentWindow?.document;
            if (!iframeDoc) return false;

            const bodyText = iframeDoc.body?.innerText || '';

            const limitPatterns = [
                /limit/i, /exceeded/i, /too many/i, /try again later/i,
                /rate limit/i, /unavailable/i, /usage limit/i,
                /monthly limit/i, /daily limit/i, /message limit/i,
                /you've reached/i, /can't send/i, /request failed/i,
                /over quota/i, /throttled/i, /temporarily blocked/i
            ];

            for (const pattern of limitPatterns) {
                if (pattern.test(bodyText)) {
                    return true;
                }
            }

            // Cek elemen tertentu
            const elements = iframeDoc.querySelectorAll('*');
            for (const el of elements) {
                const text = el.innerText || '';
                if (text && /limit|exceeded|too many|rate limit|unavailable|try again later/i.test(text)) {
                    if (el.offsetParent !== null && el.offsetHeight > 0) {
                        return true;
                    }
                }
            }

            return false;

        } catch(e) {
            // Cross-origin error — skip
            return false;
        }
    }

    // ==================== AUTO-SWITCH LOOP ====================
    function autoCheckAndSwitch() {
        if (isSwitching) return;

        const acc = ACCOUNTS[currentIndex];

        // Cek limit
        const isLimit = checkIframeForLimit();

        if (isLimit) {
            addLog(`🚨 ${acc.label} KENA LIMIT!`, 'error');
            accountStatus[acc.email] = 'limit';
            updateSidebar();
            statusBadge.textContent = 'Limit';
            statusBadge.className = 'badge danger';

            // Tampilkan overlay countdown
            overlay.classList.add('show');
            let countdown = 3;
            countdownTimerEl.textContent = countdown;

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                countdown--;
                countdownTimerEl.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    // Switch ke akun berikutnya
                    isSwitching = true;
                    nextAccount();
                    isSwitching = false;
                    overlay.classList.remove('show');
                }
            }, 1000);

        } else {
            // Update status
            if (accountStatus[acc.email] !== 'online') {
                accountStatus[acc.email] = 'online';
                updateSidebar();
                statusBadge.textContent = 'Online';
                statusBadge.className = 'badge';
                addLog(`✅ ${acc.label} Online`, 'highlight');
            }
        }
    }

    // ==================== LOGOUT ALL ====================
    function logoutAll() {
        if (confirm('🚪 Logout semua akun Claude?')) {
            addLog('🚪 Logout semua akun...', 'warn');
            // Hapus semua cookie Claude
            document.cookie.split(';').forEach(c => {
                document.cookie = c.replace(/^ +/, '')
                    .replace(/=.*/, `=; expires=${new Date(0).toUTCString()}; path=/; domain=.claude.ai`);
            });
            // Refresh iframe ke login
            mainFrame.src = 'https://claude.ai/login';
            // Reset status
            Object.keys(accountStatus).forEach(key => {
                accountStatus[key] = 'idle';
            });
            updateSidebar();
            statusBadge.textContent = 'Logged Out';
            statusBadge.className = 'badge warning';
            addLog('✅ Semua akun logout', 'highlight');
        }
    }

    // ==================== REFRESH ALL ====================
    function refreshAll() {
        addLog('⟳ Refresh semua tab...', 'warn');
        // Refresh iframe
        const currentSrc = mainFrame.src;
        mainFrame.src = 'about:blank';
        setTimeout(() => {
            mainFrame.src = currentSrc;
        }, 500);
        // Refresh sidebar status
        Object.keys(accountStatus).forEach(key => {
            accountStatus[key] = 'idle';
        });
        updateSidebar();
        addLog('✅ Refresh selesai', 'highlight');
    }

    // ==================== INIT ====================
    function init() {
        // Load saved index
        try {
            const saved = localStorage.getItem('claude_11_index');
            if (saved !== null) {
                const idx = parseInt(saved);
                if (!isNaN(idx) && idx >= 0 && idx < ACCOUNTS.length) {
                    currentIndex = idx;
                }
            }
        } catch(e) {}

        // Init status
        ACCOUNTS.forEach(acc => {
            accountStatus[acc.email] = 'idle';
        });

        // Render sidebar
        updateSidebar();

        // Load akun pertama
        switchToAccount(currentIndex);

        // Event
        document.getElementById('btnNext').addEventListener('click', () => {
            if (!isSwitching) nextAccount();
        });
        document.getElementById('btnPrev').addEventListener('click', () => {
            if (!isSwitching) prevAccount();
        });
        document.getElementById('btnLogoutAll').addEventListener('click', logoutAll);
        document.getElementById('btnRefreshAll').addEventListener('click', refreshAll);

        // Auto-check loop
        setInterval(autoCheckAndSwitch, CHECK_INTERVAL);

        // Save index periodically
        setInterval(() => {
            try {
                localStorage.setItem('claude_11_index', currentIndex);
            } catch(e) {}
        }, 10000);

        addLog(`🔥 CLAUDE 11 AKUN DASHBOARD siap! Total ${ACCOUNTS.length} akun.`, 'highlight');
        addLog(`📌 Akun aktif: ${ACCOUNTS[currentIndex].label}`, 'highlight');
        addLog(`⏱ Auto-check limit tiap ${CHECK_INTERVAL/1000} detik`, '');
    }

    // ==================== RUN ====================
    init();

    // Export ke global
    window.__claude11 = {
        accounts: ACCOUNTS,
        currentIndex: () => currentIndex,
        switchTo: switchToAccount,
        next: nextAccount,
        prev: prevAccount,
        status: accountStatus,
        checkLimit: checkIframeForLimit,
        logoutAll: logoutAll
    };

    console.log('💡 Panggil __claude11.switchTo(0) buat pindah ke akun 1');
    console.log('💡 Panggil __claude11.next() buat next otomatis');

</script>
</body>
</html>
