<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>🔥 Claude 11 Akun - HP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 80px;
        }
        h1 {
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid #00ff41;
            padding-bottom: 10px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .status-box {
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
        }
        .status-box .active {
            font-size: 16px;
            color: #ffcc00;
            word-break: break-all;
            font-weight: bold;
        }
        .status-box .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
        }
        .badge.online { background: #00ff41; color: #000; }
        .badge.limit { background: #ff4444; color: #fff; }
        .badge.idle { background: #444; color: #aaa; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin: 10px 0;
        }
        .btn {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 12px 6px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .btn:active { background: #00ff41; color: #000; transform: scale(0.95); }
        .btn.danger { border-color: #ff4444; color: #ff4444; }
        .btn.danger:active { background: #ff4444; color: #000; }
        .btn.warning { border-color: #ffcc00; color: #ffcc00; }
        .btn.warning:active { background: #ffcc00; color: #000; }
        .btn.full { grid-column: 1 / -1; }
        .btn.big { padding: 16px; font-size: 16px; }
        .list {
            margin-top: 10px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: #111;
            border-radius: 6px;
            margin-bottom: 3px;
            border-left: 3px solid #333;
            font-size: 12px;
        }
        .item.active {
            border-left-color: #00ff41;
            background: #1a1a1a;
        }
        .item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: #00ff41; }
        .dot.limit { background: #ff4444; }
        .dot.idle { background: #444; }
        .log {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            padding: 8px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 10px;
            color: #666;
            margin-top: 10px;
        }
        .log span { display: block; padding: 2px 0; border-bottom: 1px solid #0d0d0d; }
        .log .hl { color: #00ff41; }
        .log .err { color: #ff4444; }
        .note {
            font-size: 10px;
            color: #444;
            text-align: center;
            margin-top: 12px;
            border-top: 1px solid #1a1a1a;
            padding-top: 10px;
        }
        .shortcut {
            background: #1a1a1a;
            padding: 8px;
            border-radius: 6px;
            margin: 8px 0;
            font-size: 11px;
            color: #888;
            text-align: center;
        }
        .shortcut strong { color: #ffcc00; }
    </style>
</head>
<body>

<h1>🔥 CLAUDE 11 AKUN - HP</h1>

<div class="status-box">
    <div>📌 Akun Aktif</div>
    <div class="active" id="activeLabel">-</div>
    <div>
        <span class="badge idle" id="statusBadge">IDLE</span>
        <span style="font-size:11px;color:#666;margin-left:10px;">🔄 <span id="switchCount">0</span>x</span>
    </div>
</div>

<div class="grid">
    <button class="btn" id="btnPrev">◀ Prev</button>
    <button class="btn warning" id="btnSwitch">🔄 Switch</button>
    <button class="btn" id="btnNext">Next ▶</button>
    <button class="btn full big" id="btnGo">🚀 Buka Claude</button>
</div>

<div class="shortcut">
    ⚡ <strong>Tap "Switch"</strong> → pindah akun + buka Claude otomatis!
</div>

<div class="list" id="accountList"></div>

<div class="log" id="logArea">
    <span class="hl">🔥 HP Switcher siap! 11 akun.</span>
    <span>💡 Tap "Switch" buat pindah akun.</span>
</div>

<div class="note">
    📌 Data tersimpan di HP lo.<br/>
    🔥 Kalo kena limit, tap "Switch" → langsung pindah akun!
</div>

<script>
    // ==================== KONFIG ====================
    const ACCOUNTS = [
        'andre1@gmail.com',
        'andre2@gmail.com',
        'andre3@gmail.com',
        'andre4@gmail.com',
        'andre5@gmail.com',
        'andre6@gmail.com',
        'andre7@gmail.com',
        'andre8@gmail.com',
        'andre9@gmail.com',
        'andre10@gmail.com',
        'andre11@gmail.com'
    ];

    // ==================== STATE ====================
    let currentIndex = parseInt(localStorage.getItem('c_idx') || '0');
    let switchCount = parseInt(localStorage.getItem('c_switch_count') || '0');

    // ==================== DOM ====================
    const activeLabel = document.getElementById('activeLabel');
    const statusBadge = document.getElementById('statusBadge');
    const switchCountEl = document.getElementById('switchCount');
    const accountList = document.getElementById('accountList');
    const logArea = document.getElementById('logArea');

    // ==================== FUNGSI ====================
    function addLog(msg, type = '') {
        const span = document.createElement('span');
        span.className = type;
        span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logArea.appendChild(span);
        logArea.scrollTop = logArea.scrollHeight;
        while (logArea.children.length > 40) {
            logArea.removeChild(logArea.firstChild);
        }
    }

    function renderList() {
        accountList.innerHTML = '';
        ACCOUNTS.forEach((email, i) => {
            const div = document.createElement('div');
            div.className = `item ${i === currentIndex ? 'active' : ''}`;
            const status = localStorage.getItem(`c_status_${i}`) || 'idle';
            const dotClass = { 'online': 'online', 'limit': 'limit', 'idle': 'idle' }[status] || 'idle';
            const shortEmail = email.length > 18 ? email.slice(0,18)+'…' : email;
            div.innerHTML = `
                <span>#${i+1} ${shortEmail}</span>
                <span><span class="dot ${dotClass}"></span> ${status}</span>
            `;
            div.onclick = () => switchTo(i);
            accountList.appendChild(div);
        });
    }

    function updateUI() {
        const email = ACCOUNTS[currentIndex] || '-';
        activeLabel.textContent = email;
        const status = localStorage.getItem(`c_status_${currentIndex}`) || 'idle';
        statusBadge.textContent = status.toUpperCase();
        statusBadge.className = `badge ${status}`;
        switchCountEl.textContent = switchCount;
        renderList();
        localStorage.setItem('c_idx', currentIndex);
        localStorage.setItem('c_switch_count', switchCount);
    }

    function switchTo(index) {
        if (index < 0 || index >= ACCOUNTS.length) return;
        currentIndex = index;
        switchCount++;
        // Mark as online
        localStorage.setItem(`c_status_${index}`, 'online');
        ACCOUNTS.forEach((_, i) => {
            if (i !== index) {
                const s = localStorage.getItem(`c_status_${i}`);
                if (s === 'online') localStorage.setItem(`c_status_${i}`, 'idle');
            }
        });
        updateUI();
        addLog(`🔄 Akun ${index+1}: ${ACCOUNTS[index]}`, 'hl');
    }

    function nextAccount() {
        const next = (currentIndex + 1) % ACCOUNTS.length;
        switchTo(next);
    }

    function prevAccount() {
        const prev = (currentIndex - 1 + ACCOUNTS.length) % ACCOUNTS.length;
        switchTo(prev);
    }

    function switchAndGo() {
        const email = ACCOUNTS[currentIndex];
        localStorage.setItem(`c_status_${currentIndex}`, 'limit');
        renderList();
        addLog(`🚨 Switch dari limit: ${email}`, 'err');
        setTimeout(() => {
            nextAccount();
            setTimeout(() => {
                window.location.href = 'https://claude.ai/login?email=' + encodeURIComponent(ACCOUNTS[currentIndex]);
            }, 400);
        }, 400);
    }

    function goToClaude() {
        const email = ACCOUNTS[currentIndex];
        window.location.href = 'https://claude.ai/login?email=' + encodeURIComponent(email);
        addLog(`🚀 Buka Claude: ${email}`, '');
    }

    // ==================== DETECT LIMIT (jika di halaman Claude) ====================
    function detectLimit() {
        if (!window.location.hostname.includes('claude')) return false;
        const body = document.body?.innerText || '';
        const patterns = ['limit','exceeded','too many','rate limit','unavailable','usage limit','try again'];
        for (const p of patterns) {
            if (body.toLowerCase().includes(p)) {
                const idx = parseInt(localStorage.getItem('c_idx') || '0');
                localStorage.setItem(`c_status_${idx}`, 'limit');
                renderList();
                addLog(`🚨 Akun ${idx+1} KENA LIMIT!`, 'err');
                return true;
            }
        }
        // Kalo ada "Claude" di title = online
        if (document.title && document.title.includes('Claude')) {
            const idx = parseInt(localStorage.getItem('c_idx') || '0');
            localStorage.setItem(`c_status_${idx}`, 'online');
            renderList();
            addLog(`✅ Akun ${idx+1} Online`, 'hl');
        }
        return false;
    }

    // ==================== INIT ====================
    function init() {
        // Detect limit kalo di Claude
        if (window.location.hostname.includes('claude')) {
            setTimeout(() => {
                if (detectLimit()) {
                    // Auto switch
                    setTimeout(() => {
                        nextAccount();
                        setTimeout(() => {
                            window.location.href = 'https://claude.ai/login?email=' + encodeURIComponent(ACCOUNTS[currentIndex]);
                        }, 500);
                    }, 1500);
                }
            }, 1500);
        }

        updateUI();
        addLog(`🔥 Claude HP Switcher siap! ${ACCOUNTS.length} akun`, 'hl');
        addLog(`📌 Aktif: ${ACCOUNTS[currentIndex]}`, '');
        addLog(`💡 Tap "Switch" buat pindah + buka Claude`, '');
    }

    // ==================== EVENT ====================
    document.getElementById('btnNext').addEventListener('click', () => {
        nextAccount();
        addLog(`⏩ Next ke akun ${currentIndex+1}`, '');
    });
    document.getElementById('btnPrev').addEventListener('click', () => {
        prevAccount();
        addLog(`⏪ Prev ke akun ${currentIndex+1}`, '');
    });
    document.getElementById('btnSwitch').addEventListener('click', switchAndGo);
    document.getElementById('btnGo').addEventListener('click', goToClaude);

    // ==================== RUN ====================
    init();

    // ==================== GLOBAL ====================
    window.__c = {
        accounts: ACCOUNTS,
        current: () => ACCOUNTS[currentIndex],
        switchTo: switchTo,
        next: nextAccount,
        prev: prevAccount,
        switchAndGo: switchAndGo,
        go: goToClaude,
        detectLimit: detectLimit
    };

    console.log('🔥 CLAUDE HP SWITCHER loaded!');
    console.log('💡 Panggil __c.switchAndGo() buat pindah akun');
</script>

</body>
</html>
